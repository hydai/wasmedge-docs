name: Crowdin Sync

on:
  # Run on pushes to main that change source docs or i18n config
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docusaurus.config.js'
      - 'crowdin.yml'

  # Allow manual trigger
  workflow_dispatch:

  # Run daily to pick up any Crowdin translation updates
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate English source translation files
        run: npx docusaurus write-translations --locale en

      - name: Upload sources to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          crowdin_branch_name: main
          config: 'crowdin.yml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          crowdin_branch_name: main
          config: 'crowdin.yml'
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'chore(i18n): sync translations from Crowdin'
          pull_request_body: |
            Automated pull request to sync latest translations from Crowdin.

            This PR was generated by the [Crowdin Sync](${{ github.server_url }}/${{ github.repository }}/actions/workflows/crowdin-sync.yml) workflow.
          pull_request_labels: 'i18n, automated'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
