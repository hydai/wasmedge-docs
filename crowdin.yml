project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  # Docusaurus docs — Markdown source files
  # Source: docs/**/*.md
  # Translations: i18n/<locale>/docusaurus-plugin-content-docs/current/**/*.md
  - source: /docs/**/*.md
    translation: /i18n/%two_letters_code%/docusaurus-plugin-content-docs/current/**/%original_file_name%

  # Docusaurus docs — MDX source files
  - source: /docs/**/*.mdx
    translation: /i18n/%two_letters_code%/docusaurus-plugin-content-docs/current/**/%original_file_name%

  # Docusaurus theme translations (navbar, footer, etc.)
  # Generated by: npx docusaurus write-translations --locale en
  - source: /i18n/en/docusaurus-theme-classic/**/*.json
    translation: /i18n/%two_letters_code%/docusaurus-theme-classic/**/%original_file_name%

  # Docusaurus plugin translations (sidebar category labels, etc.)
  - source: /i18n/en/docusaurus-plugin-content-docs/**/*.json
    translation: /i18n/%two_letters_code%/docusaurus-plugin-content-docs/**/%original_file_name%

  # React code translations (useTranslate / <Translate> components)
  # Generated by: npx docusaurus write-translations --locale en
  - source: /i18n/en/code.json
    translation: /i18n/%two_letters_code%/%original_file_name%
